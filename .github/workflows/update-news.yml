name: Auto Update Government News

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Fetch latest news
        run: |
          python3 - <<'PY'
          import urllib.request
          import xml.etree.ElementTree as ET
          import json
          import html
          import os
          import re

          url = "https://news.google.com/rss/search?q=India+government+schemes+OR+government+jobs+OR+scholarship&hl=en-IN&gl=IN&ceid=IN:en"

          request = urllib.request.Request(
              url,
              headers={"User-Agent": "Mozilla/5.0"}
          )

          with urllib.request.urlopen(request, timeout=30) as response:
              data = response.read()

          root = ET.fromstring(data)

          news = []

          for item in root.findall(".//item")[:15]:
              title = item.findtext("title", "")
              link = item.findtext("link", "")
              pub_date = item.findtext("pubDate", "")

              title = html.unescape(title).strip()

              title = re.sub(r"\s+", " ", title)

              if title:
                  news.append({
                      "title": title,
                      "link": link,
                      "date": pub_date
                  })

          os.makedirs("data", exist_ok=True)

          with open("data/news.json", "w", encoding="utf-8") as f:
              json.dump(news, f, ensure_ascii=False, indent=2)

          print(f"Updated {len(news)} news articles.")
          PY

      - name: Commit updated news
        run: |
          git config user.name "JanSuvidha Bot"
          git config user.email "actions@users.noreply.github.com"

          git add data/news.json

          git diff --cached --quiet || git commit -m "Auto update government news"

          git push
